<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator - 5 Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div id="games-container"></div>
        <button id="generate-btn">Generate 5 Games</button>

        <div class="contact-section">
            <hr>
            <h3>Partnership Inquiry</h3>
            <form action="https://formspree.io/f/mnjbopnr" method="POST" id="contact-form">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
        </div>

        <div id="comments-section" style="margin-top: 3rem;">
            <hr style="border: 0; border-top: 1px solid var(--inner-shadow-color); margin-bottom: 2rem;">
            <div id="disqus_thread"></div>
