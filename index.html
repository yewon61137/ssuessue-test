<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto & Animal Face Test</title>
    <link rel="stylesheet" href="style.css">
    <!-- Teachable Machine Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
    <div class="container">
        <h1>Lotto & Animal Test</h1>
        
        <!-- Animal Face Test Section -->
        <div class="test-section">
            <h2>Animal Face Test</h2>
            <p>Upload a photo to see if you look like a Dog or a Cat!</p>
            <div id="upload-area">
                <input type="file" id="image-input" accept="image/*" onchange="readURL(this);" style="display: none;">
                <label for="image-input" class="upload-label">Click to Upload Image</label>
                <img id="face-image" src="#" alt="your image" style="display: none; max-width: 100%; margin-top: 20px; border-radius: 10px;">
            </div>
            <div id="loading" style="display: none; margin-top: 10px;">Analyzing...</div>
            <div id="label-container" style="margin-top: 20px;"></div>
        </div>

        <hr style="margin: 3rem 0; border: 0; border-top: 1px solid var(--inner-shadow-color);">

        <!-- Lotto Section -->
        <div class="lotto-section">
            <h2>Lotto Number Generator</h2>
            <div id="games-container"></div>
            <button id="generate-btn">Generate 5 Games</button>
        </div>

        <div class="contact-section">
            <hr>
            <h3>Partnership Inquiry</h3>
            <form action="https://formspree.io/f/mnjbopnr" method="POST" id="contact-form">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
        </div>

        <div id="comments-section" style="margin-top: 3rem;">
            <hr style="border: 0; border-top: 1px solid var(--inner-shadow-color); margin-bottom: 2rem;">
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://ssuessue-test.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
